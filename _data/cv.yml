    Research & Publications:
      - name: Deep Learning-Based Intelligent Monitoring Framework for Anchored Shotcrete Retaining Walls
        date: 2026
        summary: Accepted at the International Conference on Computing in Civil Engineering (i3CE 2026), organized by ASCE and Seoul National University, Songdo, Incheon, South Korea.
        highlights:
          - "Invited for both oral presentation and academic poster presentation."
          - "Focus on UAV-based computer vision systems for automated construction phase monitoring under real construction site conditions."

    Projects:
      - name: Intelligent Construction Monitoring using Computer Vision
        date: Sep. 2025 – Present
        summary: Development of CNN-based systems for automated construction phase classification using UAV imagery.
        highlights:
          - "Built a proprietary UAV dataset under real construction conditions."
          - "Implemented ResNet50 and EfficientNet-B0 models for construction state classification."
          - "Achieved up to 97% accuracy under optimized training conditions."
          - "Integrated Grad-CAM explainability analysis and Power BI dashboards for PPC and Lookahead monitoring."

      - name: BIM Modeling in Revit for Tower 3 of the Los Cerezos de Surco Residential Complex
        date: Mar. 2025 – Jul. 2025
        summary: BIM modeling and technical information extraction for clash detection and quantity takeoff automation.
        highlights:
          - "Led the structural BIM modeling initiative, including reinforced concrete and steel reinforcement detailing in Revit 2025 for the Tower 3 project, achieving 95% project completion."
          - "Fully automated quantity takeoff workflows in Dynamo for concrete, formwork, and reinforcing steel items in structural elements, achieving less than 5% deviation compared to conventional quantity estimation methods."

      - name: Analysis of the Project “Improvement and Expansion of the Operational and Logistics Capacity of the CEOES at San Lorenzo Station, Callao, Lima”
        date: Aug. 2024 – Dec. 2024
        summary: Construction cost engineering and project planning analysis.
        highlights:
          - "Performed quantity takeoffs for temporary works, foundations, slabs, beams, columns, and shear walls."
          - "Simulated project schedules, monthly cash flow, S-curve analysis, and earned value metrics."

      - name: Evaluation Study of the Hydrological Sensitivity of the Santa River Basin to Climate Change
        date: Sep. 2024 – Dec. 2024
        summary: Hydrological and hydroclimatic analysis under climate variability scenarios.
        highlights:
          - "Evaluated hydroclimatic data from 1981–2016."
          - "Applied the GR4J hydrological model under different climate scenarios."
          - "Performed bias correction on PISCO climate product datasets."
          - "Analyzed precipitation, temperature, and streamflow data."

      - name: Design of Hydraulic Canal Systems in the Ocoña River, Arequipa Region, Peru
        date: Mar. 2024 – Jul. 2024
        summary: Hydraulic infrastructure and flow simulation analysis.
        highlights:
          - "Designed hydraulic canal system configurations for water conveyance infrastructure."
          - "Modeled flood scenarios using HEC-RAS and hydraulic simulations."
          - "Performed hydraulic channel modeling and flow simulations in OpenFOAM."

