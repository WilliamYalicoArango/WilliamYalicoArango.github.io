          - "Supervised electrical and sanitary installations in Tower 4."
          - "Coordinated logistics of materials, machinery, subcontractors, and external services."
          - "Collected field measurements and construction data for project analysis and diagnostics."
          - "Supported budgeting and technical office activities."

      - company: CITEMAC Laboratory
