  summary: Research-oriented Civil Engineering student at UTEC and Project Control Intern at COSAPI S.A., focused on robust AI and computer vision systems for complex real-world construction environments. Research interests include domain shift mitigation, explainability in deep learning, multimodal construction monitoring, UAV-based perception systems, and intelligent construction state representation under operational variability.

