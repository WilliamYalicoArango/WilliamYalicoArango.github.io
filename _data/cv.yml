        end_date: 2025-01
        highlights:
          - "Performed monitoring and quality certification tracking for construction projects."
          - "Prepared quality dossiers including concrete compressive strength tests, diamond core tests, and compaction tests under Peruvian technical standards."
          - "Developed statistical controls and graphical analysis for concrete quality evaluation."

    Publications:
      - title: Deep Learning-Based Construction Phase Monitoring Using UAV Imagery for Anchored Shotcrete Retaining Walls
        authors:
          - William Eduardo Yalico Arango
        publisher: International Conference on Computing in Civil Engineering (i3CE 2026)
        releaseDate: 2026
        summary: Research focused on deep learning and UAV-based monitoring systems for automated classification of construction phases under real construction site conditions.

    Projects:
      - name: Intelligent Construction Monitoring using Computer Vision
        start_date: 2025-09
        end_date: Present
        summary: Development of CNN-based systems for automated construction phase classification using UAV imagery.
        highlights:
          - "Built a proprietary UAV dataset under real construction conditions."
          - "Implemented ResNet50 and EfficientNet-B0 models for construction state classification."
          - "Achieved up to 97% accuracy under optimized training conditions."
          - "Integrated Grad-CAM explainability analysis and Power BI dashboards for PPC and Lookahead monitoring."

      - name: BIM Modeling in Revit for Tower 3 of the Los Cerezos de Surco Residential Complex for Clash Detection and Optimized Technical Information Extraction
        start_date: 2025-03
        end_date: 2025-07
        summary: BIM modeling and technical information extraction for clash detection and quantity takeoff automation.
        highlights:
          - "Led the structural BIM modeling initiative, including reinforced concrete and steel reinforcement detailing in Revit 2025 for the Tower 3 project, achieving 95% project completion."
          - "Fully automated quantity takeoff workflows in Dynamo for concrete, formwork, and reinforcing steel items in structural elements, achieving less than 5% deviation compared to conventional quantity estimation methods."

      - name: Analysis of the Project “Improvement and Expansion of the Operational and Logistics Capacity of the CEOES at San Lorenzo Station, Callao, Lima”
        start_date: 2024-08
        end_date: 2024-12
        summary: Construction cost engineering and project planning analysis.
        highlights:
          - "Performed quantity takeoffs for temporary works, foundations, slabs, beams, columns, and shear walls."
          - "Simulated project schedules, monthly cash flow, S-curve analysis, and earned value metrics."

      - name: Evaluation Study of the Hydrological Sensitivity of the Santa River Basin to Climate Change
        start_date: 2024-09
        end_date: 2024-12
        summary: Hydrological and hydroclimatic analysis under climate variability scenarios.
        highlights:
          - "Evaluated the hydrological sensitivity of the Santa River Basin to climate change through the analysis of hydroclimatic data from 1981–2016."
          - "Applied the GR4J hydrological model to simulate basin response under different climate scenarios and performed bias correction on PISCO climate product datasets."
          - "Prepared and calibrated hydroclimatic databases, including evapotranspiration time series estimation using the Hargreaves & Samani model."
          - "Analyzed precipitation, temperature, and streamflow data to assess the impact of climate variability on flow regime behavior."

      - name: Design of Hydraulic Canal Systems in the Ocoña River, Arequipa Region, Peru
        start_date: 2024-03
        end_date: 2024-07
        summary: Hydraulic infrastructure and flow simulation analysis.
        highlights:
          - "Designed hydraulic canal system configurations for water conveyance infrastructure."
          - "Modeled flood scenarios using HEC-RAS and delineated water conveyance routes through hydraulic and topographic analysis."
          - "Simulated hydraulic structures to evaluate full-scale flow behavior using software tools such as Iber, QGIS, Civil 3D, and HCanales."
          - "Performed hydraulic channel modeling and flow simulations in OpenFOAM."

